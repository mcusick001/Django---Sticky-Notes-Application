{% extends "sticky_notes/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow p-4 border-danger">
            <h3 class="text-danger mb-3">Delete Note</h3>
            <p class="fs-5">Are you sure you want to delete "<strong>{{ note.title }}</strong>"?</p>
            <form method="POST" class="mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                <a href="{% url 'note-list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
