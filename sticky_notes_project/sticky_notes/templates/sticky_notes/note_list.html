{% extends "sticky_notes/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>All Notes</h2>
    <a href="{% url 'note-create' %}" class="btn btn-primary">+ Add New Note</a>
</div>
<div class="row">
    {% for note in notes %}
    <div class="col-md-4 mb-4">
        <div class="sticky-note h-100 d-flex flex-column justify-content-between">
            <div>
                <h4><a href="{% url 'note-detail' note.pk %}" class="text-dark text-decoration-none">{{ note.title }}</a></h4>
                <p class="text-muted small">Updated: {{ note.updated_at|date:"M d, Y H:i" }}</p>
                <p class="card-text text-truncate">{{ note.content }}</p>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-3">
                <a href="{% url 'note-update' note.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
                <a href="{% url 'note-delete' note.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center py-5">
        <p class="text-muted">No sticky notes found. Create your first one!</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
