{% extends "sticky_notes/base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title mb-3">{{ note.title }}</h2>
                <h6 class="card-subtitle mb-4 text-muted">Created: {{ note.created_at|date:"M d, Y H:i" }}</h6>
                <hr>
                <p class="card-text fs-5" style="white-space: pre-wrap;">{{ note.content }}</p>
                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'note-list' %}" class="btn btn-secondary">Back to List</a>
                    <div>
                        <a href="{% url 'note-update' note.pk %}" class="btn btn-primary">Edit</a>
                        <a href="{% url 'note-delete' note.pk %}" class="btn btn-danger">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
